<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artificium Alvearium – Visual Arts Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Visual Arts</div>
    <a href="index.html" class="back-btn">Back to Home</a>
  </header>

  <!-- Gallery Room -->
  <main class="gallery-room">
    <!-- Fixed-Size Background Image -->
    <div class="gallery-fixed">
      <img src="Gallery.png" alt="Art Gallery Room" usemap="#art-map" class="gallery-bg" />
    </div>

    <!-- Image Map for Artwork Hotspots -->
    <map name="art-map">
      <area shape="rect" coords="208,216,24,420" data-art="Philus" data-artist="Christopher William Wambua" data-price="$180" alt="Philus" />
      <area shape="rect" coords="367,277,263,367" data-art="VV" data-artist="Christopher William Wambua" data-price="$125" alt="VV" />
      <area shape="rect" coords="512,303,426,362" data-art="Fyer" data-artist="Christopher William Wambua" data-price="$1" alt="Fyer" />
      <area shape="rect" coords="569,275,773,400" data-art="Myror" data-artist="Christopher William Wambua" data-price="$120" alt="Myror" />
      <area shape="rect" coords="979,284,807,395" data-art="Mortis" data-artist="Christopher William Wambua" data-price="$750" alt="Mortis" />
      <area shape="rect" coords="1350,275,1166,406" data-art="Fruity" data-artist="Christopher William Wambua" data-price="$600" alt="Fruity" />
    </map>
  </main>

  <!-- Modal for Enlarged Art -->
  <div id="artModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Artwork" />
      <div class="art-details">
        <p><strong>Artist:</strong> <span id="artistName"></span></p>
        <p><strong>Title:</strong> <span id="artTitle"></span></p>
        <p><strong>Price:</strong> <span id="artPrice"></span></p>
      </div>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
