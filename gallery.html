<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artificium Alvearium – Visual Arts Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Visual Arts</div>
    <a href="index.html" class="back-btn">Back to Home</a>
  </header>

  <!-- Gallery Room -->
  <main class="gallery-room">
    <!-- Background Image -->
    <div class="gallery-bg">
      <img src="Gallery.png" alt="Art Gallery Room" />
    </div>

    <!-- Artworks -->
    <div class="artwork-container">
      <div class="artwork" data-art="Philus" data-artist="Christopher William Wambua" data-price="$180">
        <img src="Philus.png" alt="Philus" />
      </div>
      <div class="artwork" data-art="VV" data-artist="Christopher William Wambua" data-price="$125">
        <img src="VV.png" alt="VV" />
      </div>
      <div class="artwork" data-art="Fyer" data-artist="Christopher William Wambua" data-price="$1">
        <img src="Fyer.png" alt="Fyer" />
      </div>
      <div class="artwork" data-art="Myror" data-artist="Christopher William Wambua" data-price="$120">
        <img src="Myror.png" alt="Myror" />
      </div>
      <div class="artwork" data-art="Mortis" data-artist="Christopher William Wambua" data-price="$750">
        <img src="Mortis.png" alt="Mortis" />
      </div>
      <div class="artwork" data-art="Fruity" data-artist="Christopher William Wambua" data-price="$600">
        <img src="Fruity.png" alt="Fruity" />
      </div>
    </div>
  </main>

  <!-- Modal for Enlarged Art -->
  <div id="artModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Artwork" />
      <div class="art-details">
        <h3 id="artTitle"></h3>
        <p><strong>Artist:</strong> <span id="artistName"></span></p>
        <p><strong>Price:</strong> <span id="artPrice"></span></p>
      </div>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
