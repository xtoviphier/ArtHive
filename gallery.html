<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artificium Alvearium – Visual Arts Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Visual Arts</div>
    <a href="index.html" class="back-btn">Back to Home</a>
  </header>

  <!-- Gallery Room -->
  <main class="gallery-room">
    <!-- Background Image with Clickable Hotspots -->
    <img src="Gallery.png" alt="Art Gallery Room" usemap="#art-map" class="gallery-bg" />

    <!-- Image Map for Artwork Hotspots -->
    <map name="art-map">
      <area shape="rect" coords="233,421,37,246" data-art="Philus" data-artist="Christopher William Wambua" data-price="$180" class="art-hotspot" alt="Philus" />
      <area shape="rect" coords="365,375,263,293" data-art="VV" data-artist="Christopher William Wambua" data-price="$125" class="art-hotspot" alt="VV" />
      <area shape="rect" coords="496,373,416,328" data-art="Fyer" data-artist="Christopher William Wambua" data-price="$1" class="art-hotspot" alt="Fyer" />
      <area shape="rect" coords="759,418,555,293" data-art="Myror" data-artist="Christopher William Wambua" data-price="$120" class="art-hotspot" alt="Myror" />
      <area shape="rect" coords="957,405,783,300" data-art="Mortis" data-artist="Christopher William Wambua" data-price="$750" class="art-hotspot" alt="Mortis" />
      <area shape="rect" coords="1327,423,1145,294" data-art="Fruity" data-artist="Christopher William Wambua" data-price="$600" class="art-hotspot" alt="Fruity" />
    </map>
  </main>

  <!-- Modal for Enlarged Art -->
  <div id="artModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Artwork" />
      <div class="art-details">
        <h3 id="artTitle"></h3>
        <p><strong>Artist:</strong> <span id="artistName"></span></p>
        <p><strong>Price:</strong> <span id="artPrice"></span></p>
      </div>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
