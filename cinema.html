<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artificium Alvearium – Visio in Membrana</title>
  <link rel="stylesheet" href="cinema.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">Visio in Membrana</div>
    <a href="index.html" class="back-btn">Back to Home</a>
  </header>

  <!-- Cinema Room -->
  <main class="cinema-room">
    <!-- Background Image -->
    <div class="cinema-bg">
      <img src="Theatre.png" alt="Cinema Theater" />
    </div>

    <!-- Video Screen -->
    <div class="screen-container">
      <video id="movieScreen" muted controls>
        <source src="video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn prev" onclick="prevVideo()">◀️ Previous</button>
      <button class="ctrl-btn play-pause" onclick="togglePlay()">⏸️ Play / Pause</button>
      <button class="ctrl-btn next" onclick="nextVideo()">▶️ Next</button>
    </div>

    <!-- Video Details -->
    <div class="details-panel">
      <p id="artist">Artist:</p>
      <p id="title">Title:</p>
      <p id="price">Price:</p>
    </div>
  </main>

  <script src="cinema.js"></script>
</body>
</html>
